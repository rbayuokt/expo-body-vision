appId: expo.modules.bodyvision.example
name: Push-ups count the same in landscape, with the HUD as a side column
tags:
  - exercise
  - orientation
---
- launchApp:
    clearState: true
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    id: input-replay
- scrollUntilVisible:
    element:
      id: demo-exercise
- tapOn:
    id: demo-exercise
- extendedWaitUntil:
    visible:
      id: rep-count
      text: "2"
    timeout: 15000
- assertVisible:
    id: rep-rejected
    text: "incomplete"
- setOrientation: PORTRAIT
