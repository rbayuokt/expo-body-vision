appId: expo.modules.bodyvision.example
name: Guided setup walks a recorded user into position and calibrates
tags:
  - smoke
  - setup
---
- launchApp:
    clearState: true
- setOrientation: PORTRAIT
- tapOn:
    id: input-replay
- scrollUntilVisible:
    element:
      id: demo-setup
- tapOn:
    id: demo-setup
- extendedWaitUntil:
    visible:
      id: setup-phase
      text: "Ready"
    timeout: 20000
- assertVisible: ".*% of frame"
